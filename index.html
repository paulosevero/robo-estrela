<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robô pega a estrela</title>
<style>
  :root {
    --sky: #e8f4ff;
    --ink: #1d2a44;
    --cell-bg: #ffffff;
    --cell-line: #b9d3ee;
    --key: #ffd84d;
    --play: #3cc26b;
    --erase: #ff9a3c;
    --bad: #ff4d4d;
    --now: #4da3ff;
    --cell: 100px;
  }
  * { box-sizing: border-box }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: manipulation }
  body {
    background: var(--sky);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-evenly;
    padding: 12px 16px;
  }
  header, #dots { display: flex; gap: 14px; align-items: center }
  .dot { width: 26px; height: 26px; border-radius: 50%; border: 4px solid var(--ink); background: #fff }
  .dot.done { background: var(--key) }
  .dot.now { box-shadow: 0 0 0 5px var(--now) }
  #mute { margin-left: 24px; font-size: 26px; background: none; border: none; cursor: pointer; width: 48px }
  #board {
    position: relative;
    display: grid;
    gap: 6px;
    padding: 6px;
    background: var(--cell-line);
    border-radius: 18px;
  }
  .cell { width: var(--cell); height: var(--cell); background: var(--cell-bg); border-radius: 12px; display: grid; place-items: center }
  .cell svg { width: 78%; height: 78% }
  #robot {
    position: absolute;
    left: 6px;
    top: 6px;
    width: var(--cell);
    height: var(--cell);
    display: grid;
    place-items: center;
    transition: transform .35s ease-in-out;
  }
  #robot svg { width: 86%; height: 86% }
  #robot.shake svg { animation: shake .12s 4 }
  @keyframes shake { 25% { transform: translateX(-10%) rotate(-8deg) } 75% { transform: translateX(10%) rotate(8deg) } }
  main { display: flex; gap: 24px }
  #code {
    width: min(300px, 38vw);
    margin: 0;
    padding: 12px 12px 12px 48px;
    background: var(--ink);
    color: #e8f4ff;
    border-radius: 18px;
    font: 600 min(22px, 2.8vw)/1.5 ui-monospace, Menlo, monospace;
  }
  #code li::marker { color: #6f86ad }
  #code li.now { background: var(--now); border-radius: 6px }
  #code li.bad { background: var(--bad); border-radius: 6px }
  #queue { display: flex; gap: 6px; padding: 0; margin: 0; list-style: none }
  #queue li {
    width: min(64px, 8.6vw);
    aspect-ratio: 1;
    border: 4px dashed var(--cell-line);
    border-radius: 12px;
    background: #fff;
    font-size: min(40px, 5.4vw);
    font-weight: 900;
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  #queue li.full { border-style: solid; border-color: var(--ink) }
  #queue li.now { background: var(--now); color: #fff }
  #queue li.bad { background: var(--bad); color: #fff; border-color: var(--bad) }
  nav { display: flex; gap: 12px }
  nav button {
    width: 88px;
    height: 88px;
    border: none;
    border-radius: 18px;
    background: var(--key);
    box-shadow: 0 6px 0 #b8941a;
    font-size: 46px;
    font-weight: 900;
    color: var(--ink);
    cursor: pointer;
  }
  nav button:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8941a }
  nav .erase { background: var(--erase); box-shadow: 0 6px 0 #b25f14; margin-right: 18px }
  nav .play { background: var(--play); box-shadow: 0 6px 0 #1f7a41; margin-left: 18px; color: #fff }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(232, 244, 255, .94);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    text-align: center;
    overflow: hidden;
  }
  .overlay.show { display: flex }
  .overlay .big { width: min(40vh, 60vw); animation: pop .6s ease-out }
  #final .big { width: min(28vh, 40vw) }
  @keyframes pop { from { transform: scale(0) rotate(-90deg) } }
  #stars { display: flex; gap: 2vw }
  #stars svg { width: min(22vh, 26vw); height: min(22vh, 26vw); animation: pop .5s ease-out backwards }
  #stars svg.off { filter: grayscale(1); opacity: .3 }
  #queue sub { font-size: 50%; margin-left: 1px }
  .enter { font-size: 40px; font-weight: 900; background: var(--play); color: #fff; border-radius: 18px; padding: 10px 28px; box-shadow: 0 6px 0 #1f7a41 }
  .confetti { position: absolute; top: -20px; width: 14px; height: 22px; animation: fall linear forwards }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg) } }
  #final p { font-size: min(44px, 5vw); font-weight: 800; margin: 0; max-width: 900px; line-height: 1.3 }
  #final .adults { display: flex; gap: 40px; font-size: 15px }
  #final .adults div { display: flex; flex-direction: column; align-items: center; gap: 6px }
  #final .adults svg { width: 180px; height: 180px }
  #phone svg { width: min(70vh, 80vw); height: min(70vh, 80vw) }
  #phone div { font-size: min(32px, 5vw); font-weight: 800 }

  /* Stacking the code under the board and splitting the buttons in two rows on phones */
  @media (max-width: 600px) {
    main { flex-direction: column; align-items: center; gap: 10px }
    #code { width: 90vw; max-height: 18vh; overflow: auto }
    body { padding: 8px 12px }
    nav { flex-wrap: wrap; justify-content: center; max-width: 380px; gap: 10px 8px }
    nav button { width: 80px; height: 80px }
    nav .erase, nav .play { order: 1; margin: 0 }
    #queue { gap: 3px }
    #queue li { width: 8.6vw; border-width: 3px }
    html, body { overflow: auto }
  }
</style>
</head>

<script>
// Describing each level as rows of text, with R for the robot, * for the star and # for a rock
const LEVELS = [
  ["...", "R.*", "..."],
  ["R..", "...", "..*"],
  ["....", "R.#*", "...."],
  ["R.#.", ".#..", "....", "..#*"],
  ["R.#..", ".##..", ".....", "..##.", "....*"],
]
const MOVES = {
  ArrowLeft: [0, -1, "←", "esquerda"],
  ArrowUp: [-1, 0, "↑", "cima"],
  ArrowDown: [1, 0, "↓", "baixo"],
  ArrowRight: [0, 1, "→", "direita"],
}
const QUEUE_LIMIT = 10

// Storing the fewest blocks that solve each level, using repeat blocks of up to 3 steps, to award 3 stars
const FEWEST_BLOCKS = [1, 2, 3, 3, 4]
const board = document.getElementById("board")
const robot = document.createElement("div")
robot.id = "robot"
robot.innerHTML = '<svg viewBox="0 0 100 100"><use href="#bot"/></svg>'
let level, rows, start, queue = [], culprit = -1, running = false, muted = false, audio

const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds))

// Playing a short melody with the Web Audio API, created lazily because browsers block audio before the first key press
function beep(frequencies) {
  if (muted) return
  audio ??= new AudioContext()
  audio.resume()
  frequencies.forEach((frequency, index) => {
    const oscillator = audio.createOscillator(), gain = audio.createGain()
    const begin = audio.currentTime + index * 0.12
    oscillator.type = "triangle"
    oscillator.frequency.value = frequency
    gain.gain.setValueAtTime(0.25, begin)
    gain.gain.exponentialRampToValueAtTime(0.001, begin + 0.25)
    oscillator.connect(gain).connect(audio.destination)
    oscillator.start(begin)
    oscillator.stop(begin + 0.25)
  })
}

// Moving the robot drawing to a cell, optionally without the sliding animation
function placeRobot([row, column], animate = true) {
  robot.style.transition = animate ? "" : "none"
  robot.style.transform = `translate(calc(${column} * (var(--cell) + 6px)), calc(${row} * (var(--cell) + 6px)))`
}

// Sizing the cells so the whole screen fits without scrolling on phones, tablets and laptops
function resize() {
  const phone = innerWidth <= 600
  const cell = Math.min(innerHeight * (phone ? 0.34 : 0.5) / rows.length, innerWidth * (phone ? 0.9 : 0.5) / rows[0].length, 130)
  document.documentElement.style.setProperty("--cell", cell + "px")
}

// Building the grid of the chosen level and putting the robot at its start
function loadLevel(number) {
  level = number
  rows = LEVELS[level]
  queue = []
  culprit = -1
  board.style.gridTemplateColumns = `repeat(${rows[0].length}, var(--cell))`
  board.innerHTML = rows.join("").split("").map(symbol =>
    `<div class="cell">${symbol === "*" ? '<svg><use href="#star"/></svg>' : symbol === "#" ? '<svg><use href="#rock"/></svg>' : ""}</div>`).join("")
  board.append(robot)
  const flat = rows.join("").indexOf("R")
  start = [Math.floor(flat / rows[0].length), flat % rows[0].length]
  placeRobot(start, false)
  resize()
  document.querySelectorAll("#win, #final").forEach(overlay => overlay.classList.remove("show"))
  draw()
}

// Redrawing the level dots, the command queue and its code version, marking the current and the wrong step
function draw(current = -1) {
  document.getElementById("dots").innerHTML = LEVELS.map((_, index) =>
    `<span class="dot ${index < level ? "done" : ""} ${index === level ? "now" : ""}"></span>`).join(" ")
  document.getElementById("queue").innerHTML = Array.from({ length: QUEUE_LIMIT }, (_, index) =>
    `<li data-index="${index}" class="${queue[index] ? "full" : ""} ${index === current ? "now" : ""} ${index === culprit ? "bad" : ""}">${queue[index] ? MOVES[queue[index].key][2] + (queue[index].times > 1 ? `<sub>×${queue[index].times}</sub>` : "") : ""}</li>`).join("")
  document.getElementById("code").innerHTML = queue.map(({ key, times }, index) => {
    const command = `${MOVES[key][2]} robô.${MOVES[key][3]}()`
    return `<li class="${index === current ? "now" : ""} ${index === culprit ? "bad" : ""}">${times > 1 ? `repetir ${times} { ${command} }` : command}</li>`
  }).join("")

  // Scrolling the code panel to the lit line, since on phones the panel is short
  document.querySelector("#code .now, #code .bad")?.scrollIntoView({ block: "nearest" })
}

// Running the queue step by step. A rock or the edge marks the culprit, and reaching the star wins
async function play() {
  if (!queue.length) return
  running = true
  culprit = -1
  let position = start
  steps: for (const [index, { key, times }] of queue.entries()) {
    draw(index)
    for (let step = 0; step < times; step++) {
      const [row, column] = [position[0] + MOVES[key][0], position[1] + MOVES[key][1]]
      const symbol = rows[row]?.[column]
      if (symbol === undefined || symbol === "#") {
        culprit = index
        break steps
      }
      position = [row, column]
      placeRobot(position)
      await wait(500)
      if (symbol === "*") return win()
    }
  }

  // Shaking the robot and sending it back to the start, keeping the queue so the child fixes only the wrong step
  beep([220, 165])
  robot.classList.add("shake")
  draw()
  await wait(700)
  robot.classList.remove("shake")
  placeRobot(start, false)
  running = false
}

// Celebrating with falling confetti and waiting for the presenter to press Enter
function win() {
  beep([523, 659, 784, 1047])
  const overlay = document.getElementById("win")
  overlay.querySelectorAll(".confetti").forEach(piece => piece.remove())
  for (let index = 0; index < 80; index++) {
    const piece = document.createElement("span")
    piece.className = "confetti"
    piece.style.left = Math.random() * 100 + "vw"
    piece.style.background = `hsl(${Math.random() * 360} 90% 60%)`
    piece.style.animationDuration = 1.5 + Math.random() * 2 + "s"
    piece.style.animationDelay = Math.random() * 0.6 + "s"
    overlay.append(piece)
  }

  // Awarding 3 stars for the shortest program, 2 for up to two extra blocks and 1 otherwise
  const stars = queue.length <= FEWEST_BLOCKS[level] ? 3 : queue.length <= FEWEST_BLOCKS[level] + 2 ? 2 : 1
  document.getElementById("stars").innerHTML = [0, 1, 2].map(index =>
    `<svg viewBox="0 0 100 100" class="${index < stars ? "" : "off"}" style="animation-delay: ${index * 0.3}s"><use href="#star"/></svg>`).join("")
  overlay.classList.add("show")
  level++
  draw()
  running = false
}

// Handling one input, whether it came from the keyboard or from a click on a button
function press(key) {
  if (running) return

  // Showing or hiding the full screen QR code that opens the game on a phone
  const phone = document.getElementById("phone")
  if (phone.classList.contains("show")) return phone.classList.remove("show")
  if (key === "q" || key === "Q") return phone.classList.add("show")
  if (document.getElementById("final").classList.contains("show")) return key === "Enter" && loadLevel(0)
  if (document.getElementById("win").classList.contains("show")) {
    if (key !== "Enter" && key !== " ") return
    if (level < LEVELS.length) return loadLevel(level)
    return document.getElementById("final").classList.add("show")
  }
  // Turning the repeat button into a key that cycles the last block through 1, 2 and 3 repetitions
  const last = queue.at(-1)
  if (key === "repeat" && last) key = String(last.times % 3 + 1)
  if (MOVES[key] && queue.length < QUEUE_LIMIT) {
    queue.push({ key, times: 1 })
    culprit = -1
    beep([440])
  } else if (["1", "2", "3"].includes(key) && last) {
    last.times = Number(key)
    culprit = -1
    beep([440, 550, 660].slice(0, last.times))
  } else if (key === "Backspace") {
    queue.splice(culprit >= 0 ? culprit : queue.length - 1, 1)
    culprit = -1
  } else if (key === "Enter" || key === " ") return play()
  else if (key === "r" || key === "R") return loadLevel(level)
  else if (key === "PageDown") return loadLevel((level + 1) % LEVELS.length)
  else if (key === "PageUp") return loadLevel((level + LEVELS.length - 1) % LEVELS.length)
  else if (key === "m" || key === "M") toggleMute()
  draw()
}

function toggleMute() {
  muted = !muted
  document.getElementById("mute").textContent = muted ? "🔇" : "🔊"
}

document.addEventListener("keydown", event => {
  if (event.repeat || event.metaKey || event.ctrlKey) return
  event.preventDefault()
  press(event.key)
})
document.querySelector("nav").addEventListener("click", event => event.target.dataset.key && press(event.target.dataset.key))
document.getElementById("mute").addEventListener("click", toggleMute)
document.querySelectorAll("#win, #final, #phone").forEach(overlay => overlay.addEventListener("click", () => press("Enter")))

// Removing a clicked queue step, so a mouse user can fix a step in the middle
document.getElementById("queue").addEventListener("click", event => {
  const index = Number(event.target.dataset.index)
  if (running || !queue[index]) return
  queue.splice(index, 1)
  culprit = -1
  draw()
})
addEventListener("resize", resize)
loadLevel(0)
</script>
</body>
</html>
